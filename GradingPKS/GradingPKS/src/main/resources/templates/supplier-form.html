<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tambah Supplier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Tambah Supplier Baru</h2>
        <form th:action="@{/grading/supplier/save}" th:object="${supplier}" method="post">
            <div class="mb-3">
                <label>Nama Supplier:</label>
                <input type="text" th:field="*{nama}" class="form-control" required/>
            </div>
            
            <div class="mb-3">
                <label>Alamat:</label>
                <textarea th:field="*{alamat}" class="form-control"></textarea>
            </div>
            
            <div class="mb-3">
                <label>Kontak:</label>
                <input type="text" th:field="*{kontak}" class="form-control"/>
            </div>
            
            <button type="submit" class="btn btn-primary">Simpan</button>
            <a href="/grading" class="btn btn-secondary">Kembali</a>
        </form>
    </div>
</body>
</html>
