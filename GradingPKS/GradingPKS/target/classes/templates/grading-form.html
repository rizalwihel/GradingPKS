<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Grading Baru - Sistem Grading PKS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.0.7/css/boxicons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
    <style>
        /* Gunakan style yang sama dengan dashboard */
        body {
            background: linear-gradient(rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.9)),
                        url('https://images.unsplash.com/photo-1542372147193-a7aca54189cd?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }

        /* Tambahan style untuk form */
        .form-card {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 15px;
            padding: 2rem;
        }

        .form-label {
            font-weight: 500;
            color: #1e4d92;
        }

        .form-control, .select2-container--default .select2-selection--single {
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            padding: 0.5rem 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(30, 77, 146, 0.1);
            border-color: #1e4d92;
        }

        .section-title {
            color: #1e4d92;
            font-weight: 600;
            margin: 1.5rem 0;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1e4d92 0%, #1e8f4e 100%);
            border: none;
            padding: 0.7rem 2rem;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(30, 77, 146, 0.2);
        }

        /* Styling untuk Select2 */
        .select2-container--default .select2-selection--single {
            height: 38px;
            line-height: 38px;
        }

        .select2-container--default .select2-selection--single .select2-selection__rendered {
            line-height: 38px;
        }

        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 36px;
        }
    </style>
</head>
<body>
    <!-- Navbar - sama dengan dashboard -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <!-- ... navbar content ... -->
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col">
                <h2><i class='bx bx-plus-circle'></i> Grading Baru</h2>
            </div>
        </div>

        <form th:action="@{/grading/calculate}" method="post" th:object="${gradingResult}">
            <div class="form-card">
                <!-- Data Supplier -->
                <h4 class="section-title"><i class='bx bx-user'></i> Data Supplier</h4>
                <div class="row mb-4">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Supplier</label>
                            <select class="form-control supplier-select" name="supplier.id" required>
                                <option value="">Pilih Supplier</option>
                                <option th:each="s : ${suppliers}" 
                                        th:value="${s.id}" 
                                        th:text="${s.nama}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Tanggal Pengiriman</label>
                            <input type="datetime-local" class="form-control" 
                                   th:field="*{tanggalPengiriman}" required/>
                        </div>
                    </div>
                </div>

                <!-- Data Berat -->
                <h4 class="section-title"><i class='bx bx-box'></i> Data Berat TBS</h4>
                <div class="row mb-4">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Jumlah Tandan</label>
                            <input type="number" class="form-control" 
                                   th:field="*{jumlahTandan}" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Berat Buah Mentah (kg)</label>
                            <input type="number" step="0.01" class="form-control" 
                                   th:field="*{beratBuahMentah}" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Berat Buah Kurang Matang (kg)</label>
                            <input type="number" step="0.01" class="form-control" 
                                   th:field="*{beratBuahKurangMatang}" required/>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Berat Buah Matang (kg)</label>
                            <input type="number" step="0.01" class="form-control" 
                                   th:field="*{beratBuahMatang}" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Berat Buah Lewat Matang (kg)</label>
                            <input type="number" step="0.01" class="form-control" 
                                   th:field="*{beratBuahLewatMatang}" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Harga per Kg (Rp)</label>
                            <input type="number" step="0.01" class="form-control" 
                                   th:field="*{hargaPerKg}" required/>
                        </div>
                    </div>
                </div>

                <!-- Data Persentase -->
                <h4 class="section-title"><i class='bx bx-pie-chart-alt-2'></i> Data Persentase</h4>
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Persentase Tandan Kosong (%)</label>
                            <input type="number" step="0.01" class="form-control" 
                                   th:field="*{persentaseTandanKosong}" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Persentase Gagang Panjang (%)</label>
                            <input type="number" step="0.01" class="form-control" 
                                   th:field="*{persentaseGagangPanjang}" required/>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Persentase Brondolan (%)</label>
                            <input type="number" step="0.01" class="form-control" 
                                   th:field="*{persentaseBrondolan}" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Persentase Brondolan Kotor (%)</label>
                            <input type="number" step="0.01" class="form-control" 
                                   th:field="*{persentaseBrondolanKotor}" required/>
                        </div>
                    </div>
                </div>

                <div class="text-end mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class='bx bx-calculator'></i> Hitung Grading
                    </button>
                </div>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script>
        $(document).ready(function() {
            $('.supplier-select').select2({
                theme: 'bootstrap-5',
                placeholder: 'Pilih Supplier'
            });
        });
    </script>
</body>
</html>
