<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Riwayat Grading - Sistem Grading PKS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.0.7/css/boxicons.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <style>
        /* Style yang sama dengan dashboard */
        body {
            background: linear-gradient(rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.9)),
                        url('https://images.unsplash.com/photo-1542372147193-a7aca54189cd?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }

        .card {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 15px;
        }

        /* Tambahan style untuk tabel */
        .dataTables_wrapper {
            padding: 1rem;
        }

        .table {
            margin-top: 1rem !important;
        }

        .table thead th {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border: none;
            padding: 1rem;
        }

        .table tbody td {
            vertical-align: middle;
            padding: 0.75rem;
        }

        .badge {
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }

        .btn-detail {
            padding: 0.4rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .btn-detail:hover {
            transform: translateY(-2px);
        }

        .dataTables_filter input {
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            padding: 0.5rem 1rem;
        }

        .dataTables_length select {
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            padding: 0.5rem;
        }

        .page-item.active .page-link {
            background: linear-gradient(135deg, #1e4d92 0%, #1e8f4e 100%);
            border: none;
        }
    </style>
</head>
<body>
    <!-- Navbar - sama dengan dashboard -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <!-- ... navbar content ... -->
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col">
                <h2><i class='bx bx-history'></i> Riwayat Grading</h2>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table id="gradingTable" class="table table-hover">
                        <thead>
                            <tr>
                                <th>Tanggal</th>
                                <th>Supplier</th>
                                <th>Berat Total</th>
                                <th>Total Pembayaran</th>
                                <th>Total Denda</th>
                                <th>Pembayaran Bersih</th>
                                <th>Status</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="grading : ${gradings}">
                                <td th:text="${#temporals.format(grading.tanggalPengiriman, 'dd-MM-yyyy HH:mm')}"></td>
                                <td th:text="${grading.supplier.nama}"></td>
                                <td th:text="${grading.beratTotalTBS + ' kg'}"></td>
                                <td th:text="${'Rp ' + #numbers.formatDecimal(grading.totalPembayaran, 0, 'COMMA', 0, 'POINT')}"></td>
                                <td th:text="${'Rp ' + #numbers.formatDecimal(grading.totalDenda, 0, 'COMMA', 0, 'POINT')}"></td>
                                <td th:text="${'Rp ' + #numbers.formatDecimal(grading.pembayaranBersih, 0, 'COMMA', 0, 'POINT')}"></td>
                                <td>
                                    <span th:if="${grading.totalDenda == 0}" class="badge bg-success">Tanpa Denda</span>
                                    <span th:unless="${grading.totalDenda == 0}" class="badge bg-warning">Ada Denda</span>
                                </td>
                                <td>
                                    <a th:href="@{/grading/detail/{id}(id=${grading.id})}" 
                                       class="btn btn-sm btn-primary btn-detail">
                                        <i class='bx bx-detail'></i> Detail
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#gradingTable').DataTable({
                language: {
                    search: "Cari:",
                    lengthMenu: "Tampilkan _MENU_ data",
                    info: "Menampilkan _START_ sampai _END_ dari _TOTAL_ data",
                    infoEmpty: "Menampilkan 0 sampai 0 dari 0 data",
                    infoFiltered: "(disaring dari _MAX_ total data)",
                    zeroRecords: "Tidak ada data yang cocok",
                    paginate: {
                        first: "Pertama",
                        last: "Terakhir",
                        next: "Selanjutnya",
                        previous: "Sebelumnya"
                    }
                },
                order: [[0, 'desc']]
            });
        });
    </script>
</body>
</html>
