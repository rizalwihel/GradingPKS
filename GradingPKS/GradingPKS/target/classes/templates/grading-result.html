<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hasil Grading TBS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Hasil Perhitungan Grading</h2>
        <div class="card">
            <div class="card-body">
                <h5>Informasi Supplier</h5>
                <p th:text="'Nama: ' + ${result.supplier.nama}"></p>
                
                <h5>Informasi TBS</h5>
                <p th:text="'Berat Buah Mentah: ' + ${result.beratBuahMentah} + ' kg (' + ${#numbers.formatDecimal(result.persentaseBuahMentah, 1, 1)} + '%)'"></p>
                <p th:text="'Berat Buah Kurang Matang: ' + ${result.beratBuahKurangMatang} + ' kg'"></p>
                <p th:text="'Berat Buah Matang: ' + ${result.beratBuahMatang} + ' kg'"></p>
                <p th:text="'Berat Buah Lewat Matang: ' + ${result.beratBuahLewatMatang} + ' kg (' + ${#numbers.formatDecimal(result.persentaseBuahLewatMatang, 1, 1)} + '%)'"></p>
                <p th:text="'Berat Total: ' + ${result.beratTotalTBS} + ' kg'"></p>
                <p th:text="'Berat Per Tandan: ' + ${result.beratPerTandan} + ' kg'"></p>
                
                <h5>Hasil Perhitungan</h5>
                <p th:text="'Total Pembayaran: Rp ' + ${#numbers.formatDecimal(result.totalPembayaran, 0, 'COMMA', 2, 'POINT')}"></p>
                <p th:text="'Total Denda: Rp ' + ${#numbers.formatDecimal(result.totalDenda, 0, 'COMMA', 2, 'POINT')}"></p>
                <p th:text="'Pembayaran Bersih: Rp ' + ${#numbers.formatDecimal(result.pembayaranBersih, 0, 'COMMA', 2, 'POINT')}"></p>
                
                <h5>Detail Denda</h5>
                <p th:text="'Denda Buah Mentah: Rp ' + ${#numbers.formatDecimal(result.dendaBuahMentah, 0, 'COMMA', 2, 'POINT')}"></p>
                <p th:text="'Denda Buah Lewat Matang: Rp ' + ${#numbers.formatDecimal(result.dendaBuahLewatMatang, 0, 'COMMA', 2, 'POINT')}"></p>
                <p th:text="'Denda Tandan Kosong: Rp ' + ${#numbers.formatDecimal(result.dendaTandanKosong, 0, 'COMMA', 2, 'POINT')}"></p>
                <p th:text="'Denda Gagang Panjang: Rp ' + ${#numbers.formatDecimal(result.dendaGagangPanjang, 0, 'COMMA', 2, 'POINT')}"></p>
                <p th:text="'Denda Brondolan: Rp ' + ${#numbers.formatDecimal(result.dendaBrondolan, 0, 'COMMA', 2, 'POINT')}"></p>
                <p th:text="'Denda Brondolan Kotor: Rp ' + ${#numbers.formatDecimal(result.dendaBrondolanKotor, 0, 'COMMA', 2, 'POINT')}"></p>
                <p th:if="${result.dendaBeratMinimal > 0}" th:text="'Denda Berat Minimal: Rp ' + ${#numbers.formatDecimal(result.dendaBeratMinimal, 0, 'COMMA', 2, 'POINT')}"></p>
            </div>
        </div>
        
        <div class="mt-3">
            <a href="/grading" class="btn btn-primary">Kembali ke Form</a>
            <a href="/grading/history" class="btn btn-info">Lihat Riwayat</a>
        </div>
    </div>
</body>
</html>
